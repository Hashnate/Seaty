name: seaty
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+5

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.0
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.6.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  http: ^1.2.1
  url_launcher: ^6.2.5
  # Hosts the Bancstac payment page in-app. The gateway is a hosted/iframe
  # page, so there is no card-entry UI on our side and no PCI scope.
  webview_flutter: ^4.10.0
  # 3.x moves to package:web ^1.0.0, which modern firebase_core_web also needs.
  # Staying on 2.x pins firebase_core to <3.5 and blocks Crashlytics.
  web_socket_channel: ^3.0.3
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.5.5
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.1.3
  mobile_scanner: ^7.2.1
  qr_flutter: ^4.1.0
  video_player: ^2.11.1
  pdf: ^3.12.0
  printing: ^5.13.0
  path_provider: ^2.1.6
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # firebase_core now ships Swift Package Manager support but firebase_messaging
  # does not, so Flutter resolved firebase_core via SPM and firebase_messaging
  # via CocoaPods - and the CocoaPods side then could not find a `firebase_core`
  # podspec, failing `pod install`. Keeping every plugin on CocoaPods avoids the
  # split. Revisit once firebase_messaging adopts SPM.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/destinations/
    - assets/videos/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_square.png"
  adaptive_icon_background: "#ffffff"
  background_color_ios: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon_adaptive_foreground.png"
  remove_alpha_ios: true

# WARNING: `dart run flutter_native_splash:create` regenerates the launch images
# at the package's own 125pt/dp base (source width / 4). The Dart splash draws the
# same logo at 170 (`_kLogoSize` in lib/screens/splash_screen.dart), so the
# regenerated assets make the logo jump 125 -> 170 at hand-off — the "blinking"
# splash. If you re-run it, resize the generated files back afterwards:
#   ios/Runner/Assets.xcassets/LaunchImage.imageset/  170 / 340 / 510 px
#   android/.../res/drawable-{m,h,x,xx,xxx}hdpi/splash.png
#                                       170 / 255 / 340 / 510 / 680 px
#   android/.../res/drawable{,-night}-{m,h,x,xx,xxx}hdpi/android12splash.png
#                                       288 / 432 / 576 / 864 / 1152 px
flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/app_logo.png"
  android_12:
    # Deliberately the full logo, NOT app_icon_adaptive_foreground.png — every
    # other stage of the launch (iOS LaunchImage, @drawable/splash, the Dart
    # SplashScreen) draws app_logo.png, so the icon-only foreground made the
    # Android 12+ system splash swap artwork mid-launch. The package insets the
    # image inside the 288dp canvas, so the wordmark clears the circular mask.
    image: "assets/images/app_logo.png"
    color: "#ffffff"
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
