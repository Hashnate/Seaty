# Secrets are NOT defined in this file. Compose-level values come from `.env`
# (see .env.example); application settings come from backend/.env via env_file.
# An `environment:` entry here silently overrides env_file, which is how the
# committed placeholder SECRET_KEY used to win over the real one.

services:
  db:
    build:
      context: .
      dockerfile: ./database/Dockerfile
    container_name: seaty-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - seaty-postgres-data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seaty-backend
    env_file:
      - ./backend/.env
    environment:
      # A path, not a secret. DATABASE_URL and SECRET_KEY deliberately live in
      # backend/.env only — do not reintroduce them here.
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
    volumes:
      - ./backend/app:/app/app
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
      - seaty-uploads:/app/uploads
    depends_on:
      - db
    restart: always

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: seaty-website
    restart: always

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: seaty-admin
    ports:
      - "8025:80"
    depends_on:
      - backend
      - website
    restart: always

volumes:
  seaty-postgres-data:
  seaty-uploads:

