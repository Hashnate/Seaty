server {
    listen 80 default_server;
    server_name seaty.hashnate.com www.seaty.hashnate.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    error_page 404 /404.html;

    # Static assets: fingerprint-free, so keep caching modest.
    location ~* \.(?:png|jpg|jpeg|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Redirect .html URLs (e.g. /support.html -> /support)
    if ($request_uri ~ ^/(.+)\.html$) {
        return 301 /$1;
    }

    # Clean URLs: /privacy-policy resolves the same as /privacy-policy.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}
