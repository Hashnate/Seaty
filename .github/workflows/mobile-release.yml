name: Mobile Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_NUMBER_OFFSET: 3  # Subtract this from run_number to get build number (next run = 1)

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Build Number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} - ${{ env.BUILD_NUMBER_OFFSET }} ))" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned. Unpinned `stable` silently moved to 3.47.1 on 2026-08-19 and
          # took Firebase down with it; a release build must not depend on which
          # day it ran.
          flutter-version: '3.47.1'
          cache: true

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/seaty.keystore
        working-directory: mobile

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=seaty.keystore" >> android/key.properties
        working-directory: mobile

      - name: Install Dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Build APK
        run: flutter build apk --release --build-number=${{ env.BUILD_NUMBER }}
        working-directory: mobile

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release --build-number=${{ env.BUILD_NUMBER }}
        working-directory: mobile

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS & Deploy to TestFlight
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Build Number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} - ${{ env.BUILD_NUMBER_OFFSET }} ))" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned. Unpinned `stable` silently moved to 3.47.1 on 2026-08-19 and
          # took Firebase down with it; a release build must not depend on which
          # day it ran.
          flutter-version: '3.47.1'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/pubspec.lock', 'mobile/ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Decode App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          python3 -c '
          import base64, os
          val = os.environ.get("API_KEY_BASE64", "")
          if val.startswith("-----BEGIN"):
              decoded = val
          else:
              decoded = base64.b64decode(val).decode("utf-8")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"APP_STORE_CONNECT_API_KEY_DECODED<<EOF\n{decoded}\nEOF\n")
          '

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PORTABLE_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary_keychain_password"
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate from secrets and copy provisioning profile from repository
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          cp Seaty_App_Store_Profile.mobileprovision $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$PORTABLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # firebase_core ships a Package.swift, firebase_messaging does not. If the
      # toolchain resolves firebase_core via SPM and the rest via CocoaPods, the
      # Firebase plugins never reach GeneratedPluginRegistrant and every
      # Firebase channel answers with `channel-error` at runtime while every
      # other plugin works. pubspec.yaml opts out; this enforces it on the
      # runner, whose Flutter version is not pinned.
      - name: Pin plugin resolution to CocoaPods
        run: |
          flutter --version
          flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      # Proves whether the Firebase plugins are actually registered with the
      # engine. `channel-error` from Firebase.initializeApp() means they are not,
      # and that is invisible at build time - the app compiles and runs fine.
      - name: Verify Firebase plugins are registered
        run: |
          echo "--- GeneratedPluginRegistrant (iOS) ---"
          grep -i firebase ios/Runner/GeneratedPluginRegistrant.m \
            || echo "!! NO FIREBASE PLUGIN IN REGISTRANT - THIS IS THE BUG !!"
          echo "--- iOS plugins resolved ---"
          grep -o '"name":"firebase[^"]*"' .flutter-plugins-dependencies || true
          echo "--- swift package manager state ---"
          grep -o '"swift_package_manager_enabled":[^,}]*' .flutter-plugins-dependencies || true

      # Runs before the 15-minute archive so a Dart breakage - a plugin major
      # bump changing an API, say - fails in seconds rather than after a build.
      #
      # Errors only. The tree carries pre-existing warnings and lints that have
      # nothing to do with releasing, and `flutter analyze` treats warnings as
      # fatal by default - which would block every build on unrelated noise.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build and export signed IPA
        run: |
          flutter build ipa --release --build-number=${{ env.BUILD_NUMBER }} --export-options-plist=ios/ExportOptions.plist
          mv build/ios/ipa/*.ipa build/ios/ipa/app.ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: mobile/build/ios/ipa/app.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ env.APP_STORE_CONNECT_API_KEY_DECODED }}
