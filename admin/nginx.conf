# Included into http{} as conf.d/default.conf, so zone declarations belong here.
#
# Per-IP rate limits on the credential endpoints. Nothing capped login attempts
# before this, so any admin password was brute-forceable at line speed
# (docs/SECURITY.md #32). The backend rate-limits OTP per phone number; these
# limits are per source address and complement that.
#
# Tuning note: Sri Lankan mobile carriers NAT heavily, so many real users can
# share one address. The login limit is deliberately tight because only staff
# use it; the passenger-facing ones are looser for that reason. If legitimate
# users start seeing 429s, raise the passenger zones before the login zone.
limit_req_zone $binary_remote_addr zone=auth_login:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_otp:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=auth_check:10m  rate=30r/m;
limit_req_status 429;

# Uploads are capped at 5MB per file in the application, and up to 5 files
# in vehicle gallery uploads. Set to 30MB so multi-photo uploads succeed.
client_max_body_size 30m;

# Applied per-server below. HSTS is deliberately absent: TLS terminates at a
# proxy in front of this container, and that is where it belongs.
map $sent_http_content_type $seaty_nosniff { default "nosniff"; }

server {
    listen 80;
    server_name api.seaty.hashnate.com;

    add_header X-Content-Type-Options $seaty_nosniff always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Password sign-in for the admin console. Staff only, so a tight cap is
    # safe and it is the account worth protecting most.
    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/nginx-proxy.conf;
    }

    # Costs an SMS on every call.
    location = /api/v1/auth/otp/send {
        limit_req zone=auth_otp burst=10 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/nginx-proxy.conf;
    }

    # A user-enumeration oracle: confirms whether a number exists and its role.
    location = /api/v1/auth/phone/check {
        limit_req zone=auth_check burst=20 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/nginx-proxy.conf;
    }

    location = /api/v1/auth/phone/login {
        limit_req zone=auth_login burst=10 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/nginx-proxy.conf;
    }

    location / {
        proxy_pass http://backend:8000;
        include /etc/nginx/nginx-proxy.conf;
    }
}

server {
    listen 80;
    server_name seaty.hashnate.com www.seaty.hashnate.com;

    add_header X-Content-Type-Options $seaty_nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://website:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    server_name admin.seaty.hashnate.com localhost;

    add_header X-Content-Type-Options $seaty_nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Same limit as the api.* block: the console is reachable through both.
    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://backend:8000/api/v1/auth/login;
        include /etc/nginx/nginx-proxy.conf;
    }

    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        include /etc/nginx/nginx-proxy.conf;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
