# Shared proxy settings for every location that forwards to the backend.
# Included rather than repeated, so a WebSocket or timeout fix cannot land in
# three of the four blocks and be forgotten in the fourth.

proxy_http_version 1.1;

# WebSocket upgrade. Seaty runs three socket endpoints (seat availability, GPS
# tracking, notifications) and they pass through the same locations as REST.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Default is 60s, which silently closed the notifications socket every minute
# of quiet - the client sends no keepalive, so in-app notifications stopped
# working shortly after sign-in while FCM push kept arriving and masked it.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
